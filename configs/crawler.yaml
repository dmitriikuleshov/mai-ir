db:
  # Адрес и имя MongoDB.
  uri: mongodb://localhost:27017
  database: mai_ir
  # Коллекции сырых документов, состояния обхода и очереди URL.
  documents_collection: documents
  state_collection: crawl_state
  queue_collection: crawl_queue

logic:
  # Идентификатор crawler с контактным адресом для владельцев сайтов.
  user_agent: MAI-IR-course-project/2.0 (mailto:workdimila@gmail.com)
  # Таймаут одного HTTP-запроса и политика повторов.
  request_timeout_seconds: 60
  retries: 4
  backoff_seconds: 2
  # При HTTP 429 останавливаем источник минимум на час; более длинный Retry-After имеет приоритет.
  rate_limit_cooldown_seconds: 3600
  # Максимальный размер одного ответа — 14 MB.
  max_response_bytes: 14000000
  # Ограничения параллельных подключений.
  total_connections: 6
  connections_per_host: 1
  # Время владения задачей crawler в распределённой очереди.
  lease_seconds: 300
  # Повторная проверка документа через 90 суток; 0 — без лимита пачки.
  recrawl_after_seconds: 7776000
  recrawl_batch_size: 0
  log_level: INFO
  # simple — статистика раз в минуту без предупреждений; detailed — подробный вывод документов и предупреждений.
  log_mode: simple
  # Минимальный интервал между началами запросов; медленный ответ дополнительно снижает частоту.
  # Wikipedia и Learn: пробный темп до двух запросов в секунду, без параллелизма внутри источника.
  # arXiv: не менее трёх секунд по условиям API. Запускать один экземпляр crawler.
  delay_seconds:
    wikipedia: 0.5
    arxiv: 3.0
    microsoft_learn: 0.5

