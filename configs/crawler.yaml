  arxiv:
    enabled: true
    max_documents: null
    # До 200 публикаций в одной выдаче: больше метаданных на один API-запрос.
    batch_size: 200
    # Размер отдельной пачки проверки изменений уже сохранённых публикаций.
    metadata_batch_size: 100
    # После пяти пачек выдачи переходим к следующей категории; позиция сохраняется.
    # При следующем запуске каждая категория продолжается со своей позиции; 0 — без ограничения.
